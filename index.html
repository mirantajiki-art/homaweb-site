<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ساخت ربات اختصاصی و سایت حرفه‌ای</title>

  <meta name="description"
        content="طراحی و ساخت ربات اختصاصی روبیکا، تلگرام و سایت حرفه‌ای برای کسب‌وکارها">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #071a2d;
      color: white;
      line-height: 1.8;
    }

    header {
      background: linear-gradient(135deg, #061426, #0d3152);
      padding: 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid #16486e;
    }

    header h1 {
      color: #20c9ff;
      font-size: 25px;
    }

    nav {
      margin-top: 10px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 8px;
      font-size: 14px;
    }

    .hero {
      padding: 70px 20px;
      text-align: center;
      background: radial-gradient(circle at top, #124e79, #071a2d 65%);
    }

    .hero h2 {
      font-size: 38px;
      color: white;
      margin-bottom: 15px;
    }

    .hero h2 span {
      color: #20c9ff;
    }

    .hero p {
      max-width: 700px;
      margin: auto;
      color: #d7e8f5;
      font-size: 18px;
    }

    .buttons {
      margin-top: 30px;
    }

    .btn {
      display: inline-block;
      padding: 13px 25px;
      margin: 7px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      background: #20aef3;
      color: white;
      box-shadow: 0 5px 20px #0005;
    }

    .btn:hover {
      background: #0c8dce;
    }

    .btn.green {
      background: #20b86b;
    }

    section {
      padding: 55px 20px;
      max-width: 1100px;
      margin: auto;
    }

    .title {
      text-align: center;
      font-size: 28px;
      color: #20c9ff;
      margin-bottom: 35px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: #0d2943;
      border: 1px solid #174d72;
      padding: 25px;
      border-radius: 18px;
      text-align: center;
      transition: .3s;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: #20c9ff;
    }

    .icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .card h3 {
      color: #20c9ff;
      margin-bottom: 8px;
    }

    .card p {
      color: #c6d8e6;
      font-size: 14px;
    }

    .about {
      background: #0a2238;
      max-width: none;
      text-align: center;
    }

    .about p {
      max-width: 800px;
      margin: auto;
      color: #d5e5f0;
    }

    .contact {
      text-align: center;
      background: linear-gradient(135deg, #0b2944, #082039);
      border-radius: 25px;
      margin-bottom: 40px;
    }

    footer {
      text-align: center;
      padding: 25px;
      background: #04111f;
      color: #91a9ba;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .hero h2 {
        font-size: 29px;
      }

      .hero p {
        font-size: 16px;
      }

      nav a {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🤖 خدمات طراحی ربات و سایت</h1>

  <nav>
    <a href="#services">خدمات</a>
    <a href="#
